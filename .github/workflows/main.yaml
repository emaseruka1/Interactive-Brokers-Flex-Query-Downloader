name: GitHub Actions Pipeline

on:
  push:
    branches:
      - main

jobs:
  checkout:
    name: Checkout Repository & Prepare Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write IBKR credentials
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.IBKR_AUTH_KEY }}" > src/main/resources/application.yml

      - name: Upload Credentials
        uses: actions/upload-artifact@v4
        with:
          name: ibkr-credentials
          path: src/main/resources/application.yml

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4